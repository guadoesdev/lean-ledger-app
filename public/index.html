<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECE4;--card:#F6F7F2;--ink:#16252A;--mute:#5B6B6E;--line:#C9D1C6;--pro:#1F6B58;--warn:#B8452A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1,h2,.num{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;margin:0}
h1{font-size:26px}h2{font-size:19px;margin:28px 0 10px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
nav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:14px 0 18px}
nav button{background:none;border:0;padding:8px 0;font:inherit;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);font-weight:600;border-color:var(--pro)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pro);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.mute{color:var(--mute);font-size:14px}
.big{font-size:56px;line-height:1}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{height:8px;background:#DDE3DA;border-radius:4px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.pro{height:14px}.bar.pro i{background:var(--pro)}
.bar.over i{background:var(--warn)}
.entry{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;padding:0 6px}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:0}
input[type=number]{width:84px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid input{width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.btn{background:var(--pro);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.warn{color:var(--warn);font-size:14px}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
@media(max-width:520px){.big{font-size:44px}}
</style>
</head>
<body>
<main>
<header><h1>Lean Ledger</h1><div id="dnav"></div></header>
<nav id="tabs"></nav>
<p id="msg" class="warn" role="alert"></p>
<div id="view"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const MEALS=['Breakfast','Lunch','Dinner','Snacks'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const iso=d=>d.toLocaleDateString('en-CA');
const shift=(d,n)=>{const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return iso(t)};

let token=null,sbc=null,resettingPassword=false;   // token = the Supabase access token for the signed-in user
const empty=()=>({profile:null,T:null,custom:[],log:[],weights:{},results:[]});
let S=empty(),date=iso(new Date()),tab='today',q='',meal='Breakfast';

// ---------- API client ----------
async function api(path,o={}){
  const r=await fetch('/api'+path,{method:o.method||'GET',
    headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},
    body:o.body?JSON.stringify(o.body):undefined});
  const j=await r.json().catch(()=>null);
  if(r.status===401&&token){logout();throw null}
  if(!r.ok)throw new Error((j&&j.error)||'Something went wrong. Try again.');
  return j;
}
async function logout(){try{await sbc.auth.signOut()}catch(e){}token=null;S=empty();tab='today';render()}
function fail(e){$('#msg').textContent=e&&e.message?e.message:''}
async function loadAll(){
  try{
    const[p,T,w,l]=await Promise.all([api('/profile'),api('/targets'),api('/weights'),api('/log?day='+date)]);
    S={profile:p,T,weights:Object.fromEntries(w.map(x=>[x.day,x.kg])),log:l,results:S.results};
    if(!p)tab='goals';fail();
  }catch(e){fail(e)}
  render();
}
async function refreshLog(){try{S.log=await api('/log?day='+date);fail()}catch(e){fail(e)}render()}
const curW=()=>{const k=Object.keys(S.weights).sort();return k.length?S.weights[k[k.length-1]]:(S.profile?S.profile.w:70)};

// ---------- navigation ----------
function renderNav(){
  if(!token){$('#dnav').innerHTML='';$('#tabs').innerHTML='';return}
  $('#dnav').innerHTML=`<button class="btn ghost" onclick="go(-1)" aria-label="Previous day">‹</button>
  <strong style="margin:0 8px">${new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</strong>
  <button class="btn ghost" onclick="go(1)" aria-label="Next day">›</button>
  <button class="btn ghost" onclick="logout()" style="margin-left:8px">Log out</button>`;
  $('#tabs').innerHTML=[['today','Today'],['summary','Summary'],['weight','Weight'],['goals','Goals']]
    .map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
}
function go(n){date=shift(date,n);refreshLog()}

// ---------- auth ----------
const viewAuth=()=>`<div class="card"><strong>Sign in to Lean Ledger</strong>
  <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="oauth('google')">Continue with Google</button></p>
  <p class="mute">Or use your email</p><div class="grid">
  <label>Email<input id="em" type="email" autocomplete="username"></label>
  <label>Password (8+ characters)<input id="pw" type="password" autocomplete="current-password"></label></div>
  <p><button class="btn" onclick="emailAuth('in')">Log in</button> <button class="btn ghost" onclick="emailAuth('up')">Register</button></p>
  <button class="btn ghost" onclick="resetPassword()">Reset password</button></div>`;
async function oauth(provider){
  fail();
  const {error}=await sbc.auth.signInWithOAuth({provider,options:{redirectTo:location.origin}});
  if(error)fail(error);
}
async function resetPassword(){
  fail();
  const email=$('#em').value.trim();
  if(!email){fail(new Error('Enter your email address to reset your password.'));return}
  try{
    const {error}=await sbc.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
    if(error)throw error;
    $('#msg').textContent='If an account exists for that email, a password reset link will be sent.';
  }catch(e){fail(e)}
}
const viewPasswordReset=()=>`<div class="card"><strong>Reset your password</strong>
  <div class="grid"><label>New password (8+ characters)<input id="newpw" type="password" autocomplete="new-password"></label></div>
  <p><button class="btn" onclick="updatePassword()">Update password</button></p></div>`;
async function updatePassword(){
  fail();
  const password=$('#newpw').value;
  try{
    const {error}=await sbc.auth.updateUser({password});
    if(error)throw error;
    resettingPassword=false;
    $('#msg').textContent='Your password has been updated.';
    await loadAll();
  }catch(e){fail(e)}
}
async function emailAuth(kind){
  fail();
  const email=$('#em').value.trim(),password=$('#pw').value;
  try{
    if(kind==='up'){
      const {data,error}=await sbc.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});
      if(error)throw error;
      if(!data.session)$('#msg').textContent='Check your email to confirm your account, then log in.';
    }else{
      const {error}=await sbc.auth.signInWithPassword({email,password});
      if(error)throw error;
    }
  }catch(e){fail(e)}
}

// ---------- today ----------
function totals(){return S.log.reduce((a,e)=>{for(const k of['kcal','p','c','f','na','fi'])a[k]+=e[k];return a},{kcal:0,p:0,c:0,f:0,na:0,fi:0})}
function bar(label,val,tgt,unit,cls=''){
  const pct=tgt?Math.min(100,val/tgt*100):0,over=val>tgt&&cls!=='pro'?' over':'';
  return`<div class="row"><span>${label}</span><span class="mute">${Math.round(val)} / ${tgt} ${unit}</span></div><div class="bar ${cls}${over}"><i style="width:${pct}%"></i></div>`;
}
function viewToday(){
  const T=S.T,t=totals(),left=T.k-Math.round(t.kcal);
  let h=`<div class="card"><div class="row"><span class="num big">${Math.abs(left)}</span><span class="mute">${left>=0?'calories left':'calories over'}</span></div>
  <div class="bar ${left<0?'over':''}"><i style="width:${Math.min(100,t.kcal/T.k*100)}%"></i></div>
  ${bar('Protein',t.p,T.p,'g','pro')}${bar('Carbs',t.c,T.c,'g')}${bar('Fat',t.f,T.f,'g')}${bar('Sodium',t.na,T.na,'mg')}
  <div class="mute">Fiber ${Math.round(t.fi)} g · Calories ${Math.round(t.kcal)} of ${T.k}</div></div>`;
  h+=chatPanel();
  for(const m of MEALS){
    const es=S.log.filter(e=>e.meal===m);
    h+=`<div class="card"><div class="row"><strong>${m}</strong><span class="mute">${Math.round(es.reduce((a,e)=>a+e.kcal,0))} kcal</span></div>`;
    h+=es.length?es.map(e=>`<div class="entry"><span>${esc(e.name)}<br><span class="mute">${e.qty} × ${esc(e.sv)} · ${Math.round(e.kcal)} kcal · ${r1(e.p)} g protein</span></span><button class="x" onclick="del('${e.id}')" aria-label="Remove">×</button></div>`).join(''):'<p class="mute" style="margin:6px 0 0">Nothing logged yet.</p>';
    h+='</div>';
  }
  return h;
}
async function del(id){try{await api('/log/'+id,{method:'DELETE'});await refreshLog()}catch(e){fail(e)}}

// ---------- weight ----------
function chart(){
  const d=Object.keys(S.weights).sort().slice(-30);
  if(d.length<2)return'<p class="mute">Log at least two weigh-ins to see a trend.</p>';
  const v=d.map(k=>S.weights[k]),avg=v.map((_,i)=>{const s=v.slice(Math.max(0,i-6),i+1);return s.reduce((a,b)=>a+b)/s.length});
  const lo=Math.min(...v)-.5,hi=Math.max(...v)+.5,X=i=>20+i*560/(d.length-1),Y=x=>180-(x-lo)/(hi-lo)*160;
  const dots=v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="3" fill="#9AA7A0"/>`).join('');
  const line=avg.map((x,i)=>`${X(i)},${Y(x)}`).join(' ');
  const j=Math.max(0,d.length-8),days=(new Date(d[d.length-1])-new Date(d[j]))/864e5;
  let msg='';
  if(days>=5){
    const rate=(avg[avg.length-1]-avg[j])/days*7,pct=-rate/curW()*100;
    msg=`<p>Trend: ${rate<=0?'down':'up'} ${r1(Math.abs(rate))} kg per week (${r1(Math.abs(pct))}% of bodyweight).</p>
    <p class="${pct>1?'warn':'mute'}">${pct>1?'That is faster than about 1% per week, which raises the risk of losing muscle. Consider eating a little more.':pct<.2?'Weight is holding steady. If this lasts two or more weeks, a small calorie trim may help.':'This is within a muscle-friendly range.'}</p>`;
  }
  return`<svg viewBox="0 0 600 200" width="100%" role="img" aria-label="Weight trend">${dots}<polyline points="${line}" fill="none" stroke="#1F6B58" stroke-width="3"/></svg>
  <div class="mute">Dots are weigh-ins. The line is a 7-entry average.</div>${msg}`;
}
function viewWeight(){
  const ks=Object.keys(S.weights).sort().reverse().slice(0,7);
  return`<div class="card"><div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap"><label>Weight for this day (kg)<input type="number" id="w" step="0.1" value="${S.weights[date]||''}"></label>
  <button class="btn" onclick="saveW()">Save weight</button></div></div>
  <div class="card">${chart()}</div>
  <div class="card">${ks.length?ks.map(k=>`<div class="row entry"><span>${k}</span><strong>${S.weights[k]} kg</strong></div>`).join(''):'<p class="mute">No weigh-ins yet.</p>'}</div>`;
}
async function saveW(){
  try{await api('/weights/'+date,{method:'PUT',body:{kg:parseFloat($('#w').value)}});await loadAll()}catch(e){fail(e)}
}

// ---------- goals ----------
function viewGoals(){
  const p=S.profile||{sex:'m',a:30,h:175,w:80,gw:75,act:1.55,def:400,ppk:2,na:2300},T=S.T;
  const n=(id,l,v,st=1)=>`<label>${l}<input type="number" id="${id}" value="${v}" step="${st}" min="0"></label>`;
  return`<div class="card"><div class="grid">
  <label>Sex<select id="sex"><option value="m" ${p.sex==='m'?'selected':''}>Male</option><option value="f" ${p.sex==='f'?'selected':''}>Female</option></select></label>
  ${n('age','Age',p.a)}${n('ht','Height (cm)',p.h)}${n('wt','Starting weight (kg)',p.w,.1)}${n('gw','Goal weight (kg)',p.gw,.1)}
  <label>Activity<select id="act">${[[1.2,'Mostly sitting'],[1.375,'Light, 1–3 days'],[1.55,'Moderate, 3–5 days'],[1.725,'Heavy, 6–7 days']].map(a=>`<option value="${a[0]}" ${a[0]===p.act?'selected':''}>${a[1]}</option>`).join('')}</select></label>
  ${n('def','Daily deficit (kcal)',p.def,50)}${n('ppk','Protein (g per kg)',p.ppk,.1)}${n('na','Sodium limit (mg)',p.na,100)}</div>
  <p><button class="btn" onclick="saveGoals()">Save goals</button></p></div>
  ${T?`<div class="card"><strong>Your daily targets</strong><p>${T.k} kcal · ${T.p} g protein · ${T.c} g carbs · ${T.f} g fat · ${T.na} mg sodium</p>
  <p class="mute">Estimated maintenance is ${T.tdee} kcal. Resting burn is about ${T.bmr} kcal.</p>
  ${T.k<T.bmr?'<p class="warn">This target is below your estimated resting burn. Consider a smaller deficit.</p>':''}
  ${T.pct>1?'<p class="warn">This deficit would lose more than 1% of bodyweight per week, which risks muscle loss.</p>':''}
  <p class="mute">These are general starting points, not medical advice. Adjust using your weight trend.</p></div>`:''}`;
}
async function saveGoals(){
  const g=id=>parseFloat($('#'+id).value),p={sex:$('#sex').value,a:g('age'),h:g('ht'),w:g('wt'),gw:g('gw'),act:g('act'),def:g('def'),ppk:g('ppk'),na:g('na')};
  try{
    await api('/profile',{method:'PUT',body:p});
    const t=iso(new Date());
    if(!S.weights[t])await api('/weights/'+t,{method:'PUT',body:{kg:p.w}});
    tab='today';await loadAll();
  }catch(e){fail(e)}
}

// ---------- chat on the Today tab, and the Summary tab ----------
const A = { img: null, msgs: [], pending: null, replace: null, day: null };
const SUM = { period: 'week' };
const c = (v, f = Math.round) => `<td align="center">${f(v)}</td>`;
const wrap = rows => `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">${rows}</table></div>`;

// ---------- chat on the Today tab ----------
function chatHtml() {
  if (!A.msgs.length) return `<p class="mute">Tell me what you ate and I will log it for you. For example: "I ate 2 scrambled eggs, 1 slice of wheat bread, and a banana for breakfast." You can also send a photo.</p>`;
  return A.msgs.map((m, i) => {
    const me = m.role === 'user';
    const actions = m.mealId && !m.undone ? `<div style="margin-top:6px;display:flex;gap:6px"><button class="btn ghost" onclick="chatUndo(${m.mealId})">Undo</button><button class="btn ghost" onclick="chatFix(${m.mealId})">Correct</button></div>`
      : m.undone ? '<div class="mute">Undone</div>'
      : m.ask && A.pending && i === A.msgs.length - 1 ? '<div style="margin-top:6px"><button class="btn ghost" onclick="chatCancel()">Cancel, don\'t log this</button></div>' : '';
    return `<div style="display:flex;justify-content:${me ? 'flex-end' : 'flex-start'};margin:6px 0"><div style="max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;` +
      `background:${me ? 'var(--pro)' : '#fff'};color:${me ? '#fff' : 'var(--ink)'};border:1px solid ${me ? 'var(--pro)' : 'var(--line)'}${m.err ? ';color:var(--warn)' : ''}">${esc(m.text)}${actions}</div></div>`;
  }).join('');
}
function chatPanel() {
  if (A.day !== date) { A.day = date; A.msgs = []; A.pending = null; A.replace = null; setTimeout(loadChat, 0); }   // load this day's saved chat
  return `<h2>Log a meal</h2><div class="card"><div id="chat" style="max-height:420px;overflow-y:auto" aria-live="polite">${chatHtml()}</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="cin" placeholder="What did you eat?" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')chatSend()" aria-label="Describe your meal">
    <label class="btn ghost" style="cursor:pointer;display:inline-block">Photo<input type="file" id="caf" accept="image/*" hidden onchange="pickImg(this)"></label>
    <button class="btn" id="cbtn" onclick="chatSend()">Send</button><button class="btn ghost" onclick="chatCheck()">Check setup</button></div><span id="aimg" class="mute"></span></div>`;
}
const renderChat = () => { const b = $('#chat'); if (b) { b.innerHTML = chatHtml(); scrollChat(); } };
function scrollChat() { const b = $('#chat'); if (b) b.scrollTop = b.scrollHeight; }
async function loadChat() {
  const day = date;
  try {
    const ms = await api('/chat/history?day=' + day);
    if (date !== day) return;
    A.msgs = ms.map(m => ({ role: m.role, text: m.text, mealId: m.meal_id, undone: m.undone, ask: !!m.pending }));
    const last = ms[ms.length - 1];
    A.pending = last && last.role === 'bot' && last.pending ? last.pending : null;   // resume an unanswered question
  } catch (e) { if (e) fail(e); }
  renderChat();
}

function pickImg(inp) {
  const f = inp.files[0]; A.img = null; $('#aimg').textContent = '';
  if (!f) return;
  const im = new Image();
  im.onload = () => {
    const s = Math.min(1, 1280 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
    cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    A.img = cv.toDataURL('image/jpeg', 0.8); $('#aimg').textContent = 'Photo ready. Press Send.'; URL.revokeObjectURL(im.src);
  };
  im.onerror = () => fail({ message: 'That image could not be read.' });
  im.src = URL.createObjectURL(f);
}

async function chatSend() {
  const inp = $('#cin'), text = inp.value.trim();
  if (!text && !A.img) return;
  const now = new Date(), eaten = new Date(`${date}T${now.toTimeString().slice(0, 5)}:00`).toISOString();   // selected day, current time
  const body = { day: date, text, image: A.img, eaten_at: eaten, hour: now.getHours(), pending: A.pending, replace: A.replace };
  A.msgs.push({ role: 'user', text: text || '(photo)' }, { role: 'bot', text: 'Working on it...', tmp: true });
  inp.value = ''; A.img = null; $('#aimg').textContent = ''; $('#caf').value = ''; $('#cbtn').disabled = true; fail(); renderChat();
  try {
    const r = await api('/chat', { method: 'POST', body });
    A.msgs.pop(); A.replace = null;
    if (r.status === 'ask') { A.pending = r.pending; A.msgs.push({ role: 'bot', text: r.reply, ask: true }); }
    else {
      A.pending = null;
      A.msgs.push({ role: 'bot', text: r.reply, mealId: r.status === 'saved' ? r.meal.id : null });
      if (r.status === 'saved') { S.log = await api('/log?day=' + date); render(); const i2 = $('#cin'); if (i2) i2.focus(); return; }   // totals and meal list update at once
    }
  } catch (e) { A.msgs.pop(); A.msgs.push({ role: 'bot', text: (e && e.message) || 'Something went wrong. Try again.', err: true }); }
  const b = $('#cbtn'); if (b) b.disabled = false;
  renderChat();
}
async function chatUndo(id) {
  try {
    await api('/meals/' + id, { method: 'DELETE' });
    A.msgs.forEach(m => { if (m.mealId === id) m.undone = true; });
    S.log = await api('/log?day=' + date); render();
  } catch (e) { fail(e); }
}
function chatFix(id) {
  A.replace = id; A.pending = null;
  A.msgs.push({ role: 'bot', text: 'What should I change about that meal?' }); renderChat(); $('#cin').focus();
}
async function chatCancel() {
  A.pending = null; A.replace = null; A.msgs.push({ role: 'bot', text: 'Okay, nothing was logged.' }); renderChat();
  try { await api('/chat/cancel', { method: 'POST', body: { day: date } }); } catch (e) {}
}

async function chatCheck() {
  A.msgs.push({ role: 'bot', text: 'Checking the AI setup...' }); renderChat();
  try {
    const r = await api('/ai/check');
    A.msgs.pop();
    A.msgs.push({ role: 'bot', text: 'Setup check:\n' + Object.entries(r).map(([k, v]) => `${/^(ok|set)/.test(v) ? 'OK' : 'FIX'}  ${k}: ${v}`).join('\n') });
  } catch (e) { A.msgs.pop(); A.msgs.push({ role: 'bot', text: (e && e.message) || 'The check failed.', err: true }); }
  renderChat();
}

// ---------- summary tab: day, week and month totals, trends and history ----------
function viewSummary() {
  setTimeout(loadSum, 0);
  return `<div class="card"><div style="display:flex;gap:8px">${['day', 'week', 'month'].map(p =>
    `<button class="btn ${SUM.period === p ? '' : 'ghost'}" onclick="SUM.period='${p}';render()">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div>
    <p class="mute">Based on the date selected at the top. Includes manual and AI-logged food.</p></div><div id="sumres"></div>`;
}
async function loadSum() {
  const b = $('#sumres'); if (!b) return;
  try {
    const r = await api(`/summary?period=${SUM.period}&date=${date}`);
    const row = (l, t, s = '') => `<tr style="${s}"><td>${l}</td>${c(t.kcal)}${c(t.protein, r1)}${c(t.carbs, r1)}${c(t.fat, r1)}${c(t.fiber, r1)}</tr>`;
    const tr = r.trend ? ['kcal', 'protein', 'carbs', 'fat', 'fiber'].filter(k => r.trend[k] != null)
      .map(k => `${k === 'kcal' ? 'Calories' : k[0].toUpperCase() + k.slice(1)} ${r.trend[k] >= 0 ? '+' : ''}${r.trend[k]}%`).join(' · ') : '';
    b.innerHTML = `<div class="card"><strong>${r.from}${r.to !== r.from ? ' to ' + r.to : ''}</strong>
      ${wrap('<tr><th align="left">Day</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>Fiber</th></tr>' +
      (r.days.map(d => row(d.day, d, 'border-top:1px solid var(--line)')).join('') || '<tr><td colspan="6" class="mute">No food logged in this period.</td></tr>') +
      (r.days_logged > 1 ? row('<strong>Total</strong>', r.total, 'border-top:2px solid var(--ink)') : '') +
      (r.days_logged ? row('<strong>Daily average</strong>', r.average) : ''))}
      ${tr ? `<p class="mute">Daily averages versus the previous ${r.period}: ${tr}</p>` : ''}</div><div id="histres"></div>`;
    const ms = await api(`/meals/history?from=${r.from}&to=${r.to}`);
    $('#histres').innerHTML = '<h2>Meal history</h2>' + (ms.length ? ms.map(m => `<div class="card"><div class="row"><strong>${esc(m.meal)}</strong>
      <span class="mute">${new Date(m.eaten_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span></div>
      <span class="mute">${esc(m.items.map(i => i.name).join(', '))} · ${Math.round(m.totals.kcal)} kcal${m.items.some(i => i.verification === 'ai_estimated') ? ' · includes AI estimates' : ''}</span></div>`).join('')
      : '<p class="mute">No AI-analyzed meals in this period.</p>');
  } catch (e) { if (e) fail(e); }
}

// ---------- render ----------
function render(){
  renderNav();
  const v=$('#view');
  if(resettingPassword){$('#dnav').innerHTML='';$('#tabs').innerHTML='';v.innerHTML=viewPasswordReset();return}
  if(!token){v.innerHTML=viewAuth();return}
  v.innerHTML=tab==='summary'&&S.profile?viewSummary():tab==='today'&&S.profile?viewToday():tab==='weight'&&S.profile?viewWeight():viewGoals();
  if($('#chat'))scrollChat();
}
async function boot(){
  try{
    const cfg=await (await fetch('/api/config')).json();
    if(!cfg.supabaseUrl||!cfg.supabaseKey)throw new Error('The server is missing SUPABASE_PUBLISHABLE_KEY.');
    sbc=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{flowType:'pkce',autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
    sbc.auth.onAuthStateChange((event,session)=>{
      const was=token;token=session?session.access_token:null;
      if(event==='PASSWORD_RECOVERY'){resettingPassword=true;render();return}
      if(event==='SIGNED_OUT'){S=empty();tab='today';render();return}
      if(session&&!was)setTimeout(loadAll,0);   // first sign-in or a restored session (token refreshes just update the token)
    });
    const {data}=await sbc.auth.getSession();
    if(!data.session)render();
  }catch(e){fail(e);render()}
}
boot();
</script>
